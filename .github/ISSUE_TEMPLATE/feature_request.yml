name: 💡 Feature request
description: Suggest a new feature or an improvement to an existing one
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Marshal. Focus on the **problem** you're trying to solve — the best solution may differ from the one you have in mind, and knowing the underlying need helps us get it right.

        Not sure whether this is a feature request or a question? Start a [discussion](https://github.com/ULTRASAT-ORG/Marshal-Issues/discussions) instead.

  - type: checkboxes
    id: prerequisites
    attributes:
      label: Before you start
      options:
        - label: I have searched [existing issues](https://github.com/ULTRASAT-ORG/Marshal-Issues/issues?q=is%3Aissue) and this has not been requested before
          required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation, pain point, or limitation you hit today.
      placeholder: I'm always frustrated when...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like Marshal to do? Be as specific as you can, including where in the UI/workflow it would live.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and workarounds
      description: Other approaches you've considered, or how you currently work around the problem.

  - type: dropdown
    id: importance
    attributes:
      label: How important is this to you?
      options:
        - Nice to have
        - Would noticeably improve my workflow
        - Blocking — I can't accomplish my task without it
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Mockups, screenshots, examples from other tools, links to related discussions, etc.
